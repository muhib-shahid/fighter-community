<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="styles/main.css">
    <style>
        .register-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 70vh;
        }
        .register-card {
            max-width: 400px; /* moderate width */
            width: 100%;
            padding: 2rem; /* comfortable padding */
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(5px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: var(--shadow);
            animation: fadeInUp 0.6s ease-out;
        }
        .register-card h2 {
            text-align: center;
            border-left: none;
            margin-bottom: 1.8rem;
            color: white;
            font-size: 1.8rem;
        }
        .register-card .form-group {
            margin-bottom: 1.2rem;
        }
        .register-card .form-group label {
            font-size: 0.9rem;
            margin-bottom: 0.3rem;
        }
        .register-card .form-group input {
            padding: 0.7rem 1rem;
            font-size: 1rem;
        }
        .register-card .btn {
            width: 100%;
            padding: 0.7rem;
            font-size: 1rem;
            margin-top: 0.5rem;
        }
        .register-card .extra-links {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }
        .register-card .extra-links a {
            color: var(--text-muted);
            text-decoration: none;
            transition: var(--transition);
        }
        .register-card .extra-links a:hover {
            color: var(--accent-gold-light);
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html"><i class="fas fa-home"></i> Home</a>
        <a href="fighters.html"><i class="fas fa-fighter-jet"></i> Fighters</a>
        <a href="manufacturers.html"><i class="fas fa-industry"></i> Manufacturers</a>
        <a href="weapons.html"><i class="fas fa-rocket"></i> Weapons</a>
        <a href="stats.html"><i class="fas fa-chart-bar"></i> Stats</a>
        <span id="authLinks"></span>
        <span id="adminLink" style="display:none;"><a href="create-fighter.html"><i class="fas fa-plus-circle"></i> Add Fighter</a></span>
    </nav>

    <div class="register-container">
        <div class="register-card">
            <h2>Join the Community</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="Choose a username" minlength="3" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Minimum 6 characters" minlength="6" required>
                </div>
                <button type="submit" class="btn"><i class="fas fa-user-plus"></i> Register</button>
            </form>
            <div id="error" class="error" style="display:none;"></div>
            <div class="extra-links">
                <a href="login.html"><i class="fas fa-sign-in-alt"></i> Already have an account? Sign In</a>
            </div>
        </div>
    </div>

    <script>
        (function() {
            document.getElementById('registerForm').onsubmit = async (e) => {
                e.preventDefault();
                const username = document.getElementById('username').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const errorDiv = document.getElementById('error');

                try {
                    const res = await fetch('/api/auth/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, email, password })
                    });
                    const data = await res.json();
                    if (data.success) {
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('user', JSON.stringify(data.user));
                        window.location.href = 'index.html';
                    } else {
                        errorDiv.style.display = 'block';
                        errorDiv.innerText = data.error || 'Registration failed';
                    }
                } catch (err) {
                    errorDiv.style.display = 'block';
                    errorDiv.innerText = 'Network error. Please try again.';
                }
            };

            const token = localStorage.getItem('token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            const authLinks = document.getElementById('authLinks');
            const adminLink = document.getElementById('adminLink');
            if (token) {
                authLinks.innerHTML = `<a href="profile.html"><i class="fas fa-user"></i> ${user.username}</a> | <a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>`;
                if (user.role === 'admin') {
                    adminLink.style.display = 'inline';
                }
            } else {
                authLinks.innerHTML = `<a href="login.html"><i class="fas fa-sign-in-alt"></i> Login</a> | <a href="register.html"><i class="fas fa-user-plus"></i> Register</a>`;
            }

            window.logout = function() {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = 'index.html';
            };
        })();
    </script>
</body>
</html>
